name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web files
        run: |
          mkdir -p www
          if [ ! -f www/index.html ]; then
            F=$(find . -path ./node_modules -prune -o -path ./android -prune -o \( -name index.html -o -name faresoran.html \) -print | head -n 1)
            echo "Found: $F"
            [ -n "$F" ] && cp "$F" www/index.html
          fi
          ls -la www
          test -f www/index.html

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Storage permission for older Android
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />\n    <application|' android/app/src/main/AndroidManifest.xml

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: carnet-depenses-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
